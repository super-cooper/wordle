---
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 30
      semver-major-days: 30
      semver-minor-days: 30
      semver-patch-days: 14
    commit-message:
      prefix: build(cargo)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 30
    commit-message:
      prefix: build(actions)
