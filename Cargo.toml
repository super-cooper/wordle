[package]
name = "wordle"
version = "0.0.0"
edition = "2024"
description = "A library for playing and solving [Wordle](https://www.nytimes.com/games/wordle/index.html) puzzles"
repository = "https://github.com/super-cooper/wordle"
license = "GPL-3.0-or-later"
keywords = ["game", "library", "wordle"]
categories = ["games"]

[lib]
name = "wordle"
path = "src/lib.rs"

[dev-dependencies]
assertables = { version = "10.1.0" }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4" }
clap = { version = "4.6.1", features = ["derive"] }
log = { version = "0.4.32" }
mockall = { version = "0.15.0" }
proptest = { version = "1.11.0" }
reqwest = { version = "0.13.4", features = ["blocking", "json", "native-tls"] }
rstest = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }

[lints.clippy]
# cargo
cargo = { level = "warn", priority = -1 }

# complexity
complexity = { level = "warn", priority = -1 }

# correctness
correctness = { level = "warn", priority = -1 }

# nursery
branches_sharing_code = "warn"
clear_with_drain = "warn"
coerce_container_to_any = "warn"
collection_is_never_read = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
doc_link_code = "warn"
fallible_impl_from = "warn"
imprecise_flops = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
large_unopt_stack_frames = "warn"
literal_string_with_formatting_args = "warn"
missing_const_for_fn = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
needless_type_cast = "warn"
non_send_fields_in_send_ty = "warn"
nonstandard_macro_braces = "warn"
option_if_let_else = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
search_is_some = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
single_option_map = "warn"
string_lit_as_bytes = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
too_long_first_doc_paragraph = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
trivial_regex = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_struct_initialization = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
while_float = "warn"

# pedantic
pedantic = { level = "warn", priority = -1 }

case_sensitive_file_extension_comparisons = "allow"
inline_always = "allow"
manual_assert = "allow"
# manual_assert_eq = "allow"
must_use_candidate = "allow"
naive_bytecount = "allow"
similar_names = "allow"
too_many_lines = "allow"
unicode_not_nfc = "allow"

# perf
perf = { level = "warn", priority = -1 }

# restriction
restriction = { level = "warn", priority = -1 }

absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
arithmetic_side_effects = "allow"
as_conversions = "allow"
blanket_clippy_restriction_lints = "allow"
cognitive_complexity = "allow"
default_numeric_fallback = "allow"
else_if_without_else = "allow"
error_impl_error = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
field_scoped_visibility_modifiers = "allow"
float_arithmetic = "allow"
impl_trait_in_params = "allow"
implicit_return = "allow"
integer_division = "allow"
iter_over_hash_type = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
min_ident_chars = "allow"
missing_asserts_for_indexing = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
mod_module_files = "allow"
non_ascii_literal = "allow"
panic = "allow"
pattern_type_mismatch = "allow"
pub_use = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
renamed_function_params = "allow"
rest_pattern_accessible_field = "allow"
self_named_module_files = "allow"
semicolon_inside_block = "allow"
shadow_reuse = "allow"
single_call_fn = "allow"
single_char_lifetime_names = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
string_slice = "allow"
unneeded_field_pattern = "allow"
unreadable_literal = "allow"
unseparated_literal_suffix = "allow"
unused_trait_names = "allow"
wildcard_enum_match_arm = "allow"

# style
style = { level = "warn", priority = -1 }

# suspicious
suspicious = { level = "warn", priority = -1 }

[lints.rust]
missing_docs = "warn"
